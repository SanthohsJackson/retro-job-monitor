version: '3.8'

services:
  job-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retro-job-monitor
    ports:
      - "3000:3000"
    volumes:
      # Persist database outside container
      - ./database:/app/database
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/stats', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
