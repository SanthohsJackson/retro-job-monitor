<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Quest Monitor</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #2b2b2b;
            font-family: 'Press Start 2P', cursive;
            padding: 0;
            overflow-x: hidden;
            min-height: 100vh;
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 19px, rgba(255, 255, 255, 0.03) 19px, rgba(255, 255, 255, 0.03) 20px),
                repeating-linear-gradient(90deg, transparent, transparent 19px, rgba(255, 255, 255, 0.03) 19px, rgba(255, 255, 255, 0.03) 20px);
        }

        /* Removed floating pixels for industrial theme */

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            padding: 20px;
        }

        .header {
            background: #7a7a7a;
            border: 6px solid #1a1a1a;
            border-top: 6px solid #ffa500;
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
            box-shadow: inset 0 -3px 0 rgba(0,0,0,0.4);
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: repeating-linear-gradient(
                45deg,
                #ffa500,
                #ffa500 10px,
                #000 10px,
                #000 20px
            );
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .title {
            font-size: 20px;
            color: #ffa500;
            text-shadow: 2px 2px 0px #000;
            display: flex;
            align-items: center;
            gap: 15px;
            text-transform: uppercase;
        }

        .coin-counter {
            background: #1a1a1a;
            border: 4px solid #ffa500;
            padding: 10px 20px;
            font-size: 14px;
            box-shadow: inset 0 0 10px rgba(255, 165, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 10px;
            color: #ffa500;
        }

        .coin-icon {
            width: 24px;
            height: 24px;
            background: #ff6b6b;
            border: 3px solid #000;
            border-radius: 50%;
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #3a3a3a;
            border: 4px solid #1a1a1a;
            border-left: 4px solid #ffa500;
            padding: 20px;
            text-align: center;
            position: relative;
            transition: transform 0.2s;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        .stat-card:hover {
            transform: translateY(-2px);
            border-left-color: #ffcc00;
        }

        .stat-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: repeating-linear-gradient(
                90deg,
                #ffa500 0px,
                #ffa500 5px,
                transparent 5px,
                transparent 10px
            );
        }

        .stat-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 32px;
            color: #ffa500;
            margin: 10px 0;
            text-shadow: 0 0 10px rgba(255, 165, 0, 0.5);
        }

        .stat-label {
            font-size: 9px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .job-card {
            background: #3a3a3a;
            border: 4px solid #1a1a1a;
            margin-bottom: 15px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.5);
        }

        .job-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 8px;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                #ffa500 0px,
                #ffa500 10px,
                #000 10px,
                #000 20px
            );
        }

        .job-card:hover {
            transform: translateX(3px);
            box-shadow: inset 0 0 40px rgba(255, 165, 0, 0.2);
        }

        .job-header {
            padding: 20px;
            padding-left: 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 2px solid #1a1a1a;
            background: linear-gradient(90deg, rgba(255,165,0,0.05) 0%, transparent 100%);
        }

        .job-title-section {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
            min-width: 300px;
        }

        .expand-btn {
            width: 36px;
            height: 36px;
            background: #1a1a1a;
            border: 3px solid #ffa500;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease-in-out;
            font-size: 16px;
            color: #ffa500;
            box-shadow: inset 0 0 10px rgba(255, 165, 0, 0.2);
        }

        .expand-btn:hover {
            background: #ffa500;
            color: #1a1a1a;
            box-shadow: 0 0 15px rgba(255, 165, 0, 0.6);
        }

        .expand-btn.expanded {
            background: #ffa500;
            color: #1a1a1a;
            transform: rotate(90deg);
        }

        .job-info {
            flex: 1;
        }

        .job-name {
            font-size: 13px;
            color: #ffa500;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .job-id {
            font-size: 8px;
            color: #999;
            background: #1a1a1a;
            padding: 5px 10px;
            border: 2px solid #333;
            display: inline-block;
            border-left: 2px solid #ffa500;
        }

        .job-status-section {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .timer {
            background: #1a1a1a;
            color: #ffa500;
            padding: 8px 15px;
            border: 2px solid #333;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
            font-size: 10px;
            font-family: monospace;
        }

        .health-bar {
            width: 200px;
            height: 28px;
            background: #1a1a1a;
            border: 3px solid #333;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
        }

        .health-bar-inner {
            height: 100%;
            transition: width 0.5s;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .health-bar-inner.running {
            background: repeating-linear-gradient(
                45deg,
                #ffa500,
                #ffa500 8px,
                #ff8c00 8px,
                #ff8c00 16px
            );
            animation: slide 1s linear infinite;
            box-shadow: 0 0 10px rgba(255, 165, 0, 0.5);
        }

        .health-bar-inner.completed {
            background: repeating-linear-gradient(
                45deg,
                #4CAF50,
                #4CAF50 8px,
                #45a049 8px,
                #45a049 16px
            );
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
        }

        .health-bar-inner.failed {
            background: repeating-linear-gradient(
                45deg,
                #d32f2f,
                #d32f2f 8px,
                #c62828 8px,
                #c62828 16px
            );
            box-shadow: 0 0 10px rgba(211, 47, 47, 0.5);
        }

        .health-bar-inner.pending {
            background: repeating-linear-gradient(
                45deg,
                #666,
                #666 8px,
                #555 8px,
                #555 16px
            );
        }

        @keyframes slide {
            0% { background-position: 0 0; }
            100% { background-position: 20px 0; }
        }

        .health-bar-text {
            position: absolute;
            width: 100%;
            text-align: center;
            font-size: 10px;
            color: #fff;
            text-shadow: 1px 1px 2px #000;
            font-weight: bold;
            z-index: 1;
        }

        .status-badge {
            padding: 8px 15px;
            border: 3px solid #1a1a1a;
            font-size: 9px;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .status-badge.running {
            background: #ffa500;
            color: #1a1a1a;
            border-color: #ff8c00;
            box-shadow: 0 0 10px rgba(255, 165, 0, 0.5);
        }

        .status-badge.completed {
            background: #4CAF50;
            color: #fff;
            border-color: #45a049;
        }

        .status-badge.failed {
            background: #d32f2f;
            color: #fff;
            border-color: #c62828;
            animation: shake 0.5s infinite;
        }

        .status-badge.pending {
            background: #666;
            color: #ccc;
            border-color: #555;
        }

        @keyframes pulse-badge {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-2px); }
            75% { transform: translateX(2px); }
        }

        .tasks-container {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.8s ease-in-out;
            background: #2a2a2a;
            border-top: 2px solid #1a1a1a;
        }

        .tasks-container.expanded {
            max-height: 3000px;
        }

        .task-list {
            padding: 20px;
        }

        .task-item {
            background: #333;
            border: 2px solid #1a1a1a;
            border-left: 3px solid #555;
            padding: 15px;
            padding-left: 23px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.3);
            transition: all 0.2s;
            position: relative;
        }

        .task-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: repeating-linear-gradient(
                0deg,
                transparent 0px,
                transparent 5px,
                rgba(255, 165, 0, 0.3) 5px,
                rgba(255, 165, 0, 0.3) 10px
            );
        }

        .task-item:hover {
            border-left-color: #ffa500;
            background: #3a3a3a;
        }

        .task-left {
            display: flex;
            align-items: center;
            gap: 15px;
            flex: 1;
            min-width: 300px;
        }

        .task-icon-box {
            width: 44px;
            height: 44px;
            border: 3px solid #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            background: #1a1a1a;
        }

        .task-icon-box.completed {
            background: #4CAF50;
            border-color: #45a049;
            color: #fff;
            box-shadow: 0 0 10px rgba(76, 175, 80, 0.3);
        }

        .task-icon-box.running {
            background: #ffa500;
            border-color: #ff8c00;
            color: #1a1a1a;
            animation: bounce 1s infinite;
            box-shadow: 0 0 10px rgba(255, 165, 0, 0.5);
        }

        .task-icon-box.failed {
            background: #d32f2f;
            border-color: #c62828;
            color: #fff;
        }

        .task-icon-box.pending {
            background: #333;
            border-color: #555;
            color: #666;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .task-details {
            flex: 1;
        }

        .task-name {
            font-size: 11px;
            color: #ccc;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .task-meta {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .task-tag {
            font-size: 8px;
            padding: 4px 8px;
            background: #1a1a1a;
            border: 1px solid #444;
            color: #888;
            border-left: 2px solid #ffa500;
        }

        .task-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pixel-divider {
            height: 8px;
            background: repeating-linear-gradient(
                45deg,
                #ffa500,
                #ffa500 10px,
                #000 10px,
                #000 20px
            );
            margin: 25px 0;
            box-shadow: 0 0 10px rgba(255, 165, 0, 0.3);
        }

        @media (max-width: 768px) {
            .title {
                font-size: 16px;
            }

            .stat-value {
                font-size: 24px;
            }

            .job-name {
                font-size: 12px;
            }

            .health-bar {
                width: 150px;
            }
        }

        /* Removed stars for industrial theme */
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <div class="title">
                    <span>⚙️ BUILD MONITOR</span>
                </div>
                <div class="coin-counter">
                    <div class="coin-icon"></div>
                    <span id="score">0</span>
                </div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-icon">📊</div>
                <div class="stat-value" id="total-jobs">0</div>
                <div class="stat-label">Total Quests</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⚡</div>
                <div class="stat-value" id="running-jobs">0</div>
                <div class="stat-label">Active</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">✨</div>
                <div class="stat-value" id="completed-jobs">0</div>
                <div class="stat-label">Complete</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">💥</div>
                <div class="stat-value" id="failed-jobs">0</div>
                <div class="stat-label">Failed</div>
            </div>
        </div>

        <div class="pixel-divider"></div>

        <div id="jobs-container"></div>
    </div>

    <script>
        // Data from API
        let jobsData = [];
        let score = 0;
        const API_BASE_URL = 'http://localhost:3000/api';

        // Fetch jobs from API
        async function fetchJobs() {
            try {
                const response = await fetch(`${API_BASE_URL}/jobs`);
                if (!response.ok) {
                    throw new Error('Failed to fetch jobs');
                }
                const jobs = await response.json();

                // Transform the data to match the expected format
                jobsData = jobs.map(job => ({
                    id: job.id,
                    name: job.name,
                    status: job.status,
                    progress: job.progress,
                    startTime: new Date(job.start_time),
                    tasks: job.tasks || []
                }));

                renderJobs();
            } catch (error) {
                console.error('Error fetching jobs:', error);
                // Show error message to user
                const container = document.getElementById('jobs-container');
                container.innerHTML = `
                    <div style="background: #3a3a3a; border: 4px solid #d32f2f; padding: 30px; text-align: center; box-shadow: inset 0 0 30px rgba(0,0,0,0.5); position: relative;">
                        <div style="position: absolute; top: 0; left: 0; right: 0; height: 6px; background: repeating-linear-gradient(45deg, #d32f2f, #d32f2f 10px, #000 10px, #000 20px);"></div>
                        <div style="font-size: 14px; color: #d32f2f; margin-bottom: 15px; text-transform: uppercase; letter-spacing: 2px;">⚠️ SYSTEM ERROR</div>
                        <div style="font-size: 10px; color: #999; margin-bottom: 10px;">Failed to load jobs. Server connection required.</div>
                        <div style="font-size: 8px; color: #666; margin-top: 15px; padding: 10px; background: #1a1a1a; border: 2px solid #333; border-left: 3px solid #ffa500;">Run: npm start or docker-compose up</div>
                    </div>
                `;
            }
        }

        function getTaskIcon(status) {
            switch(status) {
                case 'completed': return '✓';
                case 'running': return '▶';
                case 'failed': return '✗';
                default: return '○';
            }
        }

        function formatDuration(startTime) {
            const now = new Date();
            const diff = now - startTime;
            const minutes = Math.floor(diff / 60000);
            const seconds = Math.floor((diff % 60000) / 1000);
            return `${minutes}m ${seconds}s`;
        }

        function updateStats() {
            const total = jobsData.length;
            const running = jobsData.filter(j => j.status === 'running').length;
            const completed = jobsData.filter(j => j.status === 'completed').length;
            const failed = jobsData.filter(j => j.status === 'failed').length;

            document.getElementById('total-jobs').textContent = total;
            document.getElementById('running-jobs').textContent = running;
            document.getElementById('completed-jobs').textContent = completed;
            document.getElementById('failed-jobs').textContent = failed;

            score = (completed * 100) + (running * 10);
            document.getElementById('score').textContent = score;
        }

        // Track which jobs are expanded
        let expandedJobs = new Set();

        function renderJobs() {
            const container = document.getElementById('jobs-container');
            
            // Save current expanded state before re-rendering
            jobsData.forEach((job, index) => {
                const tasksContainer = document.getElementById(`tasks-${index}`);
                if (tasksContainer && tasksContainer.classList.contains('expanded')) {
                    expandedJobs.add(index);
                }
            });
            
            container.innerHTML = '';

            jobsData.forEach((job, index) => {
                const jobCard = document.createElement('div');
                jobCard.className = 'job-card';
                jobCard.innerHTML = `
                    <div class="job-header">
                        <div class="job-title-section">
                            <div class="expand-btn" onclick="toggleTasks(${index})" id="expand-btn-${index}">
                                ▶
                            </div>
                            <div class="job-info">
                                <div class="job-name">${job.name}</div>
                                <div class="job-id">${job.id}</div>
                            </div>
                        </div>
                        <div class="job-status-section">
                            <div class="timer">${formatDuration(job.startTime)}</div>
                            <div class="health-bar">
                                <div class="health-bar-inner ${job.status}" style="width: ${job.progress}%">
                                    <div class="health-bar-text">${job.progress}%</div>
                                </div>
                            </div>
                            <div class="status-badge ${job.status}">${job.status}</div>
                        </div>
                    </div>
                    <div class="tasks-container" id="tasks-${index}">
                        <div class="task-list">
                            ${job.tasks.map(task => `
                                <div class="task-item">
                                    <div class="task-left">
                                        <div class="task-icon-box ${task.status}">
                                            ${getTaskIcon(task.status)}
                                        </div>
                                        <div class="task-details">
                                            <div class="task-name">${task.name}</div>
                                            <div class="task-meta">
                                                <span class="task-tag">${task.id}</span>
                                                <span class="task-tag">⏱️ ${task.duration}</span>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="task-right">
                                        <div class="status-badge ${task.status}">${task.status}</div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                container.appendChild(jobCard);
                
                // Restore expanded state if it was expanded before
                if (expandedJobs.has(index)) {
                    const tasksContainer = document.getElementById(`tasks-${index}`);
                    const expandBtn = document.getElementById(`expand-btn-${index}`);
                    tasksContainer.classList.add('expanded');
                    expandBtn.classList.add('expanded');
                }
            });

            updateStats();
        }

        function toggleTasks(index) {
            const tasksContainer = document.getElementById(`tasks-${index}`);
            const expandBtn = document.getElementById(`expand-btn-${index}`);
            
            tasksContainer.classList.toggle('expanded');
            expandBtn.classList.toggle('expanded');
            
            // Update expanded state tracking
            if (tasksContainer.classList.contains('expanded')) {
                expandedJobs.add(index);
            } else {
                expandedJobs.delete(index);
            }
        }

        // Initial load
        fetchJobs();

        // Refresh data every 2 seconds
        setInterval(() => {
            fetchJobs();
        }, 2000);
    </script>
</body>
</html>
